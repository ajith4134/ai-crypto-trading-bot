services:

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: trading_bot
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bot_net
    # NOT exposed externally — localhost only via Docker network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru --save ""
    networks:
      - bot_net
    # NOT exposed externally

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - bot_net
    # Port 11434 NOT exposed externally — brain accesses via Docker network

  # llama_cpp replaces the original airllm service.
  # ERROR: AirLLM conversion requires ~132 GB RAM (loads all shards simultaneously) — OOM-killed 3x.
  # ALTERNATIVE: llama.cpp server with pre-quantized Q4_K_M GGUF.
  # Same goal: CPU-only local 70B inference, ~4-8 GB peak RAM via memory-mapped GGUF.
  llama_cpp:
    build:
      context: .
      dockerfile: Dockerfile.llamacpp
    restart: unless-stopped
    volumes:
      - /models:/models
    networks:
      - bot_net
    deploy:
      resources:
        limits:
          memory: 10G
    # Port 8080 NOT exposed externally — celery_worker accesses via Docker network

  brain:
    build: .
    restart: unless-stopped
    command: python main.py
    env_file: .env
    depends_on:
      - postgres
      - redis
      - ollama
    networks:
      - bot_net
    deploy:
      resources:
        limits:
          memory: 2G

  data_feed:
    build: .
    restart: unless-stopped
    command: python -m data.feed
    env_file: .env
    depends_on:
      - redis
      - postgres
    networks:
      - bot_net
    deploy:
      resources:
        limits:
          memory: 1G

  scanner:
    build: .
    restart: unless-stopped
    command: python -m scanner.main
    env_file: .env
    depends_on:
      - redis
      - postgres
    networks:
      - bot_net
    deploy:
      resources:
        limits:
          memory: 512M

  web_intel:
    build: .
    restart: unless-stopped
    command: python -m web_intel.main
    env_file: .env
    depends_on:
      - redis
      - postgres
      - llama_cpp
    networks:
      - bot_net
    deploy:
      resources:
        limits:
          memory: 512M

  dashboard:
    build: .
    restart: unless-stopped
    command: uvicorn dashboard.api:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on:
      - redis
      - postgres
    networks:
      - bot_net
    # Dashboard not exposed directly to internet — nginx proxies to it
    deploy:
      resources:
        limits:
          memory: 512M

  celery_worker:
    build: .
    restart: unless-stopped
    command: celery -A celery_app worker --queues=default --concurrency=2 --loglevel=info
    env_file: .env
    depends_on:
      - redis
      - postgres
      - ollama
      - llama_cpp
    networks:
      - bot_net
    deploy:
      resources:
        limits:
          memory: 2G

  watchdog:
    build: .
    restart: unless-stopped
    command: python -m watchdog.main
    env_file: .env
    depends_on:
      - brain
      - data_feed
      - scanner
      - web_intel
      - dashboard
      - celery_worker
    networks:
      - bot_net
    deploy:
      resources:
        limits:
          memory: 256M

  pretrainer:
    build: .
    # One-shot service — not started by default `docker compose up`
    profiles:
      - pretrainer
    command: python -m pretrainer.main
    env_file: .env
    depends_on:
      - postgres
    networks:
      - bot_net
    deploy:
      resources:
        limits:
          memory: 8G

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - dashboard
    networks:
      - bot_net

volumes:
  postgres_data:
  ollama_models:

networks:
  bot_net:
    driver: bridge
