events {
    worker_connections 1024;
}

http {
    # HTTP only — HTTPS will be enabled when Let's Encrypt cert is obtained (Task C-04)
    server {
        listen 80;
        server_name _;

        # Serve React frontend static files
        root /app/frontend/build;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Proxy all API routes to FastAPI backend
        location /auth/   { proxy_pass http://dashboard:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /bot/    { proxy_pass http://dashboard:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /trades/ { proxy_pass http://dashboard:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /brain/  { proxy_pass http://dashboard:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /signals/    { proxy_pass http://dashboard:8000; proxy_set_header Host $host; }
        location /pairs/      { proxy_pass http://dashboard:8000; proxy_set_header Host $host; }
        location /strategies/ { proxy_pass http://dashboard:8000; proxy_set_header Host $host; }
        location /analytics/  { proxy_pass http://dashboard:8000; proxy_set_header Host $host; }
        location /account/    { proxy_pass http://dashboard:8000; proxy_set_header Host $host; }
        location /features/   { proxy_pass http://dashboard:8000; proxy_set_header Host $host; }
        location /system/     { proxy_pass http://dashboard:8000; proxy_set_header Host $host; }
        location /web_intel/  { proxy_pass http://dashboard:8000; proxy_set_header Host $host; }
        location /models/     { proxy_pass http://dashboard:8000; proxy_set_header Host $host; }
        location /health      { proxy_pass http://dashboard:8000; }

        # WebSocket upgrade
        location /ws/ {
            proxy_pass http://dashboard:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600;
        }
    }
}
