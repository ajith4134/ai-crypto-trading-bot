events {
    worker_connections 1024;
}

http {
    # Redirect all HTTP to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Serve React frontend static files
        root /app/frontend/build;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Proxy API and WebSocket to FastAPI backend
        location /api/ {
            proxy_pass http://dashboard:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/ { proxy_pass http://dashboard:8000; proxy_set_header Host $host; }
        location /bot/ { proxy_pass http://dashboard:8000; proxy_set_header Host $host; }
        location /trades/ { proxy_pass http://dashboard:8000; proxy_set_header Host $host; }
        location /brain/ { proxy_pass http://dashboard:8000; proxy_set_header Host $host; }
        location /signals/ { proxy_pass http://dashboard:8000; proxy_set_header Host $host; }
        location /pairs/ { proxy_pass http://dashboard:8000; proxy_set_header Host $host; }
        location /strategies/ { proxy_pass http://dashboard:8000; proxy_set_header Host $host; }
        location /analytics/ { proxy_pass http://dashboard:8000; proxy_set_header Host $host; }
        location /account/ { proxy_pass http://dashboard:8000; proxy_set_header Host $host; }
        location /features/ { proxy_pass http://dashboard:8000; proxy_set_header Host $host; }
        location /system/ { proxy_pass http://dashboard:8000; proxy_set_header Host $host; }
        location /web_intel/ { proxy_pass http://dashboard:8000; proxy_set_header Host $host; }
        location /models/ { proxy_pass http://dashboard:8000; proxy_set_header Host $host; }
        location /health { proxy_pass http://dashboard:8000; }

        # WebSocket upgrade
        location /ws/ {
            proxy_pass http://dashboard:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600;
        }
    }
}
