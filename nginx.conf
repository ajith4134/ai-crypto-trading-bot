events {
    worker_connections 1024;
}

http {
    # Docker's internal DNS resolver — re-resolve upstream hostnames every 10s.
    # Without this, nginx caches the dashboard container's IP at startup.
    # When dashboard restarts and gets a new IP, all requests return 502 until nginx restarts.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name _;

        # Serve React frontend static files
        root /app/frontend/build;
        index index.html;
        try_files $uri $uri/ /index.html;

        # cont. 70c — never cache index.html so a new content-hashed bundle is
        # always picked up after a frontend rebuild (hashed /static/* assets are
        # immutable and may be cached normally).
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires -1;
        }

        # Variable forces nginx to use the resolver on every request instead of caching at startup
        set $dashboard http://dashboard:8000;

        # Proxy all API routes to FastAPI backend
        location /auth/       { proxy_pass $dashboard; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /bot/        { proxy_pass $dashboard; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /trades/     { proxy_pass $dashboard; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /brain/      { proxy_pass $dashboard; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /signals/    { proxy_pass $dashboard; proxy_set_header Host $host; }
        location /pairs/      { proxy_pass $dashboard; proxy_set_header Host $host; }
        location /strategies  { rewrite ^/strategies/?$ /strategies break; proxy_pass $dashboard; proxy_set_header Host $host; }
        location /analytics/  { proxy_pass $dashboard; proxy_set_header Host $host; }
        location /account/    { proxy_pass $dashboard; proxy_set_header Host $host; }
        location /features/   { proxy_pass $dashboard; proxy_set_header Host $host; }
        location /system/     { proxy_pass $dashboard; proxy_set_header Host $host; }
        location /web_intel/  { proxy_pass $dashboard; proxy_set_header Host $host; }
        location /models      { rewrite ^/models/?$ /models break; proxy_pass $dashboard; proxy_set_header Host $host; }
        location /llm/        { proxy_pass $dashboard; proxy_set_header Host $host; }
        location /hedge/      { proxy_pass $dashboard; proxy_set_header Host $host; }
        location /memory/     { proxy_pass $dashboard; proxy_set_header Host $host; }
        location /decoders/   { proxy_pass $dashboard; proxy_set_header Host $host; }
        location /self_play/  { proxy_pass $dashboard; proxy_set_header Host $host; }
        location /sessions/   { proxy_pass $dashboard; proxy_set_header Host $host; }
        location /launchpad   { proxy_pass $dashboard; proxy_set_header Host $host; }
        location /scibrain    { proxy_pass $dashboard; proxy_set_header Host $host; }
        location /health      { proxy_pass $dashboard; }

        # WebSocket upgrade
        location /ws/ {
            proxy_pass $dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600;
        }
    }
}
