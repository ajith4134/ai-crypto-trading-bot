trading:
  mode: paper                    # paper | live — controlled via dashboard or .env
  paper_trade_threshold: 2000    # minimum closed paper trades before live is unlocked
  max_active_pairs: 200
  min_open_trades: null          # SET BY USER IN DASHBOARD before starting — bot will not trade until set
  max_open_trades: null          # SET BY USER IN DASHBOARD before starting — bot will not trade until set
  max_position_usdt: null        # SET BY USER IN DASHBOARD before starting — absolute USDT cap per trade
  max_total_capital_pct: 80      # never deploy more than 80% of account capital at once

capital:
  per_trade_min_pct: 5           # minimum capital per trade as % of account
  per_trade_max_pct: 30          # maximum capital per trade as % of account
  leverage_min: 3                # Phase 0 locked via Redis (was 20x, reduced after risk audit)
  leverage_max: 5                # hard cap — Redis key risk:leverage overrides at runtime
  dca_trigger_1_pct: -20         # first DCA at -20% from original entry (long) / +20% (short)
  dca_trigger_2_pct: -40         # second DCA at -40% from original entry (long) / +40% (short)
  dca_rounds_max: 0              # DISABLED 2026-05-24: 123 DCA trades = 1.6% win, -$2364; 2135 no-DCA = 49.8% win, +$4317

risk:
  daily_loss_limit_pct: 5        # live mode only — pause new opens if daily loss > 5%
  max_drawdown_pct: 15           # live mode only — pause new opens if drawdown > 15% from peak
  circuit_breaker_live_only: true
  # Profit-Lock Ratchet (cont. 44, 2026-05-24): SL acts as TP via tiered dollar locks.
  # Once peak_pnl_usdt crosses a tier, SL moves to a price that realises ≥lock_pct of peak.
  # Tiers are checked top-down — highest matching tier wins. List of [trigger_usdt, lock_pct].
  # Empirical motivation: $44k of peak profit given back across 2195 closed trades pre-cont-44.
  profit_lock_tiers:
    - [50, 0.92]                 # peak ≥ $50  → lock 92%
    - [25, 0.90]                 # peak ≥ $25  → lock 90%
    - [10, 0.85]                 # peak ≥ $10  → lock 85%
    - [2,  0.80]                 # peak ≥ $2   → lock 80% (entry threshold)
  # Capital-anchored SL + activation + dead-trade exit (cont. 62, 2026-05-29
  # owner mandate). Defaults live in code; these entries document them and
  # any change here must also be reflected in risk/manager.py defaults.
  # All values are runtime-overridable via Redis (redis_keys.RISK_*).
  capital_sl_frac: 0.50          # initial SL ≥ 50% of capital loss
  capital_activation_frac: 0.11  # trailing arms at ≥ 11% capital profit
  dead_trade_min_age_s: 2700     # 45 min before dead-trade rule applies
  dead_trade_small_abs_usdt: 2.0 # small-loss band — absolute $
  dead_trade_small_pct_capital: 0.015  # small-loss band — % of capital
  dead_trade_peak_threshold_usdt: 0.5  # "never showed profit" if peak ≤ $0.50
  dead_trade_force_close_max_s: 21600  # 6 h hard ceiling if loss never reverts

brain:
  evolution_stage: 4             # updated 2026-06-06: bot reached Stage 4 at 10,641 trades
  stage_1_to_2_trades: 100       # Stage 1→2: 100 closed paper trades (no performance requirement)
  stage_2_to_3_trades: 500       # Stage 2→3: 500 closed paper trades + win rate ≥ 45%
  stage_2_to_3_winrate: 45
  stage_3_to_4_trades: 1500      # Stage 3→4: 1500 trades + win rate ≥ 52% + Sharpe ≥ 1.0
  stage_3_to_4_winrate: 52
  stage_3_to_4_sharpe: 1.0
  live_unlock_trades: 2000        # Live unlock: 2000 trades + Stage 4 + win rate ≥ 52% + Sharpe ≥ 1.0
  opro_window_size: 5             # run OPRO optimization every 5 closed trades
  code_rewrite_interval_trades: 500  # DGM code rewriting every 500 trades

curiosity:
  exploration_budget_pct: 12     # 10-15% of paper trading capacity goes to exploration

strategies:
  trial_min_trades: 30           # new strategies must complete ≥30 paper trades before promotion
  trial_min_days: 7              # AND ≥7 calendar days — whichever is reached last
  counterfactual_window_hours: 72  # track rejected signals for 72 hours

scanner:
  rescan_interval_hours: 8
  # Categorised 10-bucket scanner (cont. 62c, 2026-05-29).
  # Active universe = top 10 per CoinGecko-category × 10 buckets ≈ 100 pairs
  # (bucketed priority core) + composite tail to max_active_pairs.
  # All values runtime-overridable from Redis (see scanner_* keys in redis_keys.py).
  categorised_mode_enabled: true   # documentation; actual switch is
                                   # absence of `scanner:categorised_mode_disabled`
  rerank_interval_minutes: 20      # composite re-rank cadence (5-180)
  per_bucket_target: 10            # pairs per bucket
  bucketed_core_target: 100        # total bucketed pairs (priority core)
  criteria_weights:
    # F50a (cont. 50): candle_setup added as 6th criterion.
    # F51c (cont. 51): adx_trend added as 7th criterion.
    # F52  (cont. 52+): open_interest added as 8th criterion.
    #   OI measures leveraged commitment (not just turnover). Rising OI
    #   alongside price confirms trend strength; thin-OI pairs (<$20M USD)
    #   have institutional liquidity traps and elevated slippage.
    #   Source: Starkiller Capital cross-sectional momentum paper;
    #   CoinGlass practitioner OI thresholds ($20M floor, $100M preferred).
    # cont. 68: rsi + ema_distance added as 9th/10th criteria — symmetric
    #   momentum-strength filters that PENALISE flat (RSI~50 / price-hugs-EMA)
    #   pairs, directly targeting the "no-movement trade" problem. All weights
    #   re-balanced to sum=1.0 (was 8 criteria @1.0 → now 10 @1.0).
    volume: 0.08
    volatility: 0.14
    spread: 0.06
    win_rate: 0.17
    pnl: 0.06
    candle_setup: 0.13
    adx_trend: 0.12
    open_interest: 0.10
    rsi: 0.08
    ema_distance: 0.06

llm:
  # Ollama — fast models, always in RAM, used for time-critical decisions
  ollama_url: "http://ollama:11434"    # Docker service name
  router_model: "llama3.2:3b"      # cont. 2026-06-04: was phi3:mini — phi3 (n_ctx_train=2048) 500'd on real decide prompts that request num_ctx=8192 (context overflow), and ran ~33s warm (way over the 8s decide budget). Benchmarked alternatives at num_ctx=8192: llama3.2:3b=6.8s warm (128k ctx, fits the 8s budget, no overflow), qwen2.5-coder:7b=19.3s, qwen2.5:3b=timeout, phi3:mini=32.8s+500s. llama3.2:3b is the only one that both kills the 500s AND returns within budget.
  decision_model: "llama3.2:3b"    # cont. 2026-06-04: see router_model note. 3B/128k-ctx → no context-overflow 500s, ~6.8s warm fits soar.py decide(timeout=8). qwen2.5-coder:7b stayed too slow on this 6-CPU box (19.3s). Reversible: revert to phi3:mini here.

  # Cloud Llama 3.3 70B — background tasks ONLY (blueprint Section 8.10).
  # History: AirLLM conversion needs ~132 GB RAM → switched to llama.cpp GGUF
  # → 42.5 GB model file failed to load on 16 GB host (1007 restart loop).
  # Current: 3-provider cloud failover (Groq → Cerebras → SambaNova), all
  # serve Llama 3.3 70B on OpenAI-compatible APIs. Keys live in .env. See
  # llm/researcher.py and BLUEPRINT_COMPLIANCE_AUDIT.md for full rationale.
  llamacpp_url: "https://api.groq.com/openai/v1"   # primary; researcher.py
                                                   # carries the full chain
  llamacpp_model_path: ""                          # unused with cloud chain
  llamacpp_tasks:
    - strategy_research
    - opro_optimization
    - ai_scientist
    - dgm_code_rewriting
    - sleep_consolidation
    - web_intel_interpretation

  fallback_to_ml_on_llm_failure: true
  no_reflection_enforced: true     # assert_no_reflection() called on every prompt

memory:
  fast_memory_size: 500            # Redis: last N trade IDs
  sleep_consolidation_hour: 3      # run sleep consolidation at 3am UTC
  opro_evaluation_window: 5        # evaluate OPRO improvement over N trades

web_intelligence:
  serpapi_searches_per_day: 8      # budget: 250/month free tier → 8/day
  reddit_fetch_interval_minutes: 60
  rss_fetch_interval_minutes: 30
  github_fetch_interval_hours: 24
  source_credibility_min_signals: 10  # new sources unweighted until ≥10 signals tracked

notifications:
  critical_alert_immediate: true
  trade_alert_enabled: true
  daily_summary_hour_utc: 8

logging:
  level: INFO
  log_to_file: true
  log_dir: /var/log/trading-bot

# F52 — Exchange Net-Flow Directional Gate (cont. 55, 2026-05-28).
# Reads free-tier endpoints; no API key required for default providers.
netflow:
  enabled: true
  refresh_interval_s: 300
  rolling_window_hours: 720       # 30d
  z_threshold_strong: 1.5
  z_threshold_extreme: 2.5
  bonus_strong: 8                 # ±8 for native pairs (BTC/ETH/SOL)
  bonus_extreme: 12               # ±12 for |z| > 2.5
  proxy_bonus_halve: true         # proxy alts get half the bonus weight

# F53 — Qlib Alpha-158 Formulaic Pool (cont. 55, 2026-05-28).
qlib_alphas:
  enabled: true
  top_k: 20
  ic_threshold: 0.02
  ic_window_hours: 168            # 7 days rolling
  refresh_interval_s: 60
  ic_refresh_interval_s: 3600
  compute_active_only: true

# F54 — LLM-DSL Crypto Alpha Miner (cont. 55, 2026-05-28).
# Uses local Ollama with qwen2.5-coder:7b (truly unlimited; see memory
# feedback_local_llm_choice.md). Switch via env DSL_PROPOSER_MODEL.
llm_dsl_alpha:
  enabled: true
  ollama_proposer_model: "qwen2.5-coder:7b"
  ollama_validator_model: "deepseek-r1:8b"
  candidates_per_run: 50
  mining_interval_s: 604800       # weekly
  promote_thresholds:
    min_sharpe: 1.0
    min_ic: 0.03
    decay_ratio_lo: 0.5
    decay_ratio_hi: 2.0
  max_promoted_factors: 30
  history_lookback_pairs: 30
  history_lookback_days: 30
  cloud_burst_enabled: false      # opt-in; flip to Cerebras when ready

# F56 — Conformal Prediction Wrapper (cont. 56, 2026-05-28).
conformal:
  enabled: true
  alpha: 0.10                     # 90% intervals
  calib_window: 200
  min_calib_samples: 30
  refresh_cron: "04:15"           # daily UTC

# F58 — Liquidation Cascade Alpha (cont. 56, 2026-05-28).
# Free tier works without API keys (uses OI×funding proxy at half weight).
# Set COINGLASS_API_KEY or COINALYZE_API_KEY env vars to enable native.
liquidation_cascade:
  enabled: true
  refresh_interval_s: 300
  proximity_threshold: 0.015      # within 1.5% = imminent
  dominance_ratio: 2.0            # one side ≥ 2× other
  bonus_native: 18
  bonus_proxy: 12                 # halved

# F60 — AlphaAgent Novelty Regularisers (cont. 56, 2026-05-28).
# Layered onto F54. Env overrides: DSL_NOVELTY_MIN_DISTANCE, DSL_NOVELTY_COMPLEXITY_CAP.
alphaagent:
  enabled: true
  min_distance: 0.30
  complexity_cap: 30
